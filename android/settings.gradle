pluginManagement { 
    includeBuild("../node_modules/@react-native/gradle-plugin") 
}

plugins { 
    id("com.facebook.react.settings") 
}

extensions.configure(com.facebook.react.ReactSettingsExtension){ 
    ex -> ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'MobileApplicationNew'

include ':app'

include ':react-native-worklets'
project(':react-native-worklets').projectDir =
        file('../node_modules/react-native-worklets/android')

includeBuild('../node_modules/@react-native/gradle-plugin')